name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning install.sh

  matrix-test:
    name: Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu:latest"
            setup: "apt-get update && apt-get install -y curl git sudo ca-certificates"
          - os: "debian:latest"
            setup: "apt-get update && apt-get install -y curl git sudo ca-certificates"
          - os: "archlinux:latest"
            setup: "pacman -Sy --noconfirm git curl sudo which ca-certificates"
          - os: "fedora:latest"
            setup: "dnf install -y git curl sudo which ca-certificates"
          - os: "alpine:latest"
            setup: "apk update && apk add --no-cache bash curl git sudo shadow ca-certificates"

    container:
      image: ${{ matrix.os }}

    steps:
      - name: Prepare Container Environment
        run: |
          ${{ matrix.setup }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Installer (First Run)
        shell: bash
        run: |
          ./install.sh --unattended --with-font

      - name: Verify Components & File Structure
        shell: bash
        run: |
          # 1. Verify Zsh executable
          command -v zsh >/dev/null 2>&1 || { echo "zsh binary not found"; exit 1; }

          # 2. Verify Oh My Zsh installation
          [[ -d "$HOME/.oh-my-zsh" ]] || { echo "Oh My Zsh directory missing"; exit 1; }

          # 3. Verify Powerlevel10k theme
          [[ -d "$HOME/.oh-my-zsh/custom/themes/powerlevel10k" ]] || { echo "P10k directory missing"; exit 1; }

          # 4. Verify plugins
          [[ -d "$HOME/.oh-my-zsh/custom/plugins/zsh-autosuggestions" ]] || { echo "zsh-autosuggestions missing"; exit 1; }
          [[ -d "$HOME/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" ]] || { echo "zsh-syntax-highlighting missing"; exit 1; }
          [[ -d "$HOME/.oh-my-zsh/custom/plugins/zsh-completions" ]] || { echo "zsh-completions missing"; exit 1; }

          # 5. Verify ~/.zshrc syntax
          [[ -f "$HOME/.zshrc" ]] || { echo "~/.zshrc missing"; exit 1; }
          zsh -n "$HOME/.zshrc"

          # 6. Verify font files
          [[ -d "$HOME/.local/share/fonts" ]] || { echo "Fonts directory missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ]] || { echo "Regular font missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Bold.ttf" ]] || { echo "Bold font missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Italic.ttf" ]] || { echo "Italic font missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Bold Italic.ttf" ]] || { echo "Bold Italic font missing"; exit 1; }

      - name: Verify Idempotency (Second Run)
        shell: bash
        run: |
          ./install.sh --unattended --with-font
          zsh -n "$HOME/.zshrc"
