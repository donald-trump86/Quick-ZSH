name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning install.sh

  matrix-test:
    name: Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu:latest"
            setup: "apt-get update && apt-get install -y curl git sudo ca-certificates"
          - os: "debian:latest"
            setup: "apt-get update && apt-get install -y curl git sudo ca-certificates"
          - os: "archlinux:latest"
            setup: "pacman -Sy --noconfirm git curl sudo which ca-certificates diffutils"
          - os: "fedora:latest"
            setup: "dnf install -y git curl sudo which ca-certificates diffutils"
          - os: "alpine:latest"
            setup: "apk update && apk add --no-cache bash curl git sudo shadow ca-certificates"

    container:
      image: ${{ matrix.os }}

    steps:
      - name: Prepare Container Environment
        run: |
          ${{ matrix.setup }}

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run Installer (First Run)
        shell: bash
        run: |
          ./install.sh --unattended --with-font

      - name: Verify Components & File Structure
        shell: bash
        run: |
          # 1. Verify Zsh executable
          command -v zsh >/dev/null 2>&1 || { echo "zsh binary not found"; exit 1; }

          # 2. Verify Oh My Zsh installation
          [[ -d "$HOME/.oh-my-zsh" ]] || { echo "Oh My Zsh directory missing"; exit 1; }

          # 3. Verify Powerlevel10k theme & config
          [[ -d "$HOME/.oh-my-zsh/custom/themes/powerlevel10k" ]] || { echo "P10k directory missing"; exit 1; }
          [[ -f "$HOME/.p10k.zsh" ]] || { echo "~/.p10k.zsh missing"; exit 1; }
          zsh -n "$HOME/.p10k.zsh"

          # 4. Verify plugins
          [[ -d "$HOME/.oh-my-zsh/custom/plugins/zsh-autosuggestions" ]] || { echo "zsh-autosuggestions missing"; exit 1; }
          [[ -d "$HOME/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" ]] || { echo "zsh-syntax-highlighting missing"; exit 1; }
          [[ -d "$HOME/.oh-my-zsh/custom/plugins/zsh-completions" ]] || { echo "zsh-completions missing"; exit 1; }

          # 5. Verify ~/.zshrc syntax
          [[ -f "$HOME/.zshrc" ]] || { echo "~/.zshrc missing"; exit 1; }
          zsh -n "$HOME/.zshrc"

          # 6. Verify font files
          [[ -d "$HOME/.local/share/fonts" ]] || { echo "Fonts directory missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Regular.ttf" ]] || { echo "Regular font missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Bold.ttf" ]] || { echo "Bold font missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Italic.ttf" ]] || { echo "Italic font missing"; exit 1; }
          [[ -f "$HOME/.local/share/fonts/MesloLGS NF Bold Italic.ttf" ]] || { echo "Bold Italic font missing"; exit 1; }

      - name: Verify Idempotency (Second Run)
        shell: bash
        run: |
          # Preserve a custom plugin and a user-edited prompt across an update.
          sed -i 's/^plugins=(git)$/plugins=(git docker)/' "$HOME/.zshrc"
          printf '\n# User custom prompt settings\n' >> "$HOME/.p10k.zsh"
          cp "$HOME/.p10k.zsh" /tmp/quick-zsh-expected-p10k.zsh
          ./install.sh --unattended --with-font
          zsh -n "$HOME/.zshrc"
          zsh -n "$HOME/.p10k.zsh"
          cmp /tmp/quick-zsh-expected-p10k.zsh "$HOME/.p10k.zsh"
          # Evaluate the plugin merge without loading external themes or plugins.
          zsh -fc 'function source() { :; }; builtin source "$HOME/.zshrc"; [[ ${plugins[(Ie)docker]} -gt 0 ]]'
          [[ $(grep -c '^# >>> Quick-ZSH Components >>>' "$HOME/.zshrc") == 1 ]]

      - name: Verify Download Failures and Backup Restoration
        shell: bash
        run: |
          # Load helpers without running the final main invocation.
          source <(sed '$d' install.sh)
          trap cleanup_temporary EXIT
          attempts=0
          flaky_download() { attempts=$((attempts + 1)); [[ "$attempts" == 3 ]]; }
          retry_download https://github.com/example/fixture flaky_download
          [[ "$attempts" == 3 ]]

          # A failed transfer must not replace a working file with partial data.
          fetch_file() { printf partial > "$1"; return 1; }
          printf original > /tmp/quick-zsh-download-test
          if download_file https://github.com/example/fixture /tmp/quick-zsh-download-test; then exit 1; fi
          [[ $(cat /tmp/quick-zsh-download-test) == original ]]

          cp "$HOME/.zshrc" /tmp/quick-zsh-restore-expected
          backup_file "$HOME/.zshrc"
          chosen_backup="$LAST_BACKUP"
          printf '\n# Change after backup\n' >> "$HOME/.zshrc"
          index=0
          selection=0
          for backup in "$HOME"/.zshrc.bak.* "$HOME"/.p10k.zsh.bak.*; do
            [[ -f "$backup" ]] || continue
            index=$((index + 1))
            [[ "$backup" != "$chosen_backup" ]] || selection="$index"
          done
          [[ "$selection" -gt 0 ]]
          TTY_INPUT=/dev/stdin
          printf '%s\ny\n' "$selection" | restore_backup
          cmp /tmp/quick-zsh-restore-expected "$HOME/.zshrc"
